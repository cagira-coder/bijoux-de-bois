# Site Nginx de la boutique, installé dans /etc/nginx/sites-available/bijoux-de-bois.com
# par deploy/vps-install.sh.
#
# Le bloc HTTPS est ajouté par Certbot une fois que le domaine pointe vers le VPS :
#   sudo certbot --nginx -d bijoux-de-bois.com -d www.bijoux-de-bois.com --redirect
#
# "default_server" : tant que le domaine ne pointe pas encore vers le VPS, la boutique est
# visible directement à http://152.228.131.140 (aucun autre site du serveur n'était par défaut).

server {
    listen 80 default_server;
    server_name bijoux-de-bois.com www.bijoux-de-bois.com;

    client_max_body_size 10m;

    location / {
        proxy_pass http://127.0.0.1:3020;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
